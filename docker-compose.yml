
services:
  db:
    image: postgres:17-alpine
    container_name: user-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: users_api
      POSTGRES_USER: users_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a senha no arquivo .env}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_api -d users_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
